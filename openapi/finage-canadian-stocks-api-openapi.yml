openapi: 3.2.0
info:
  title: Finage Market Data Canadian Stocks API
  description: Finage is a real-time and historical market data provider covering US and global stocks, forex, cryptocurrencies, indices, ETFs, bonds, and company fundamentals. This OpenAPI was generated by API Evangelist from Finage's own machine-readable docs database (https://api.finage.co.uk/op/v1/endpoints/list — the same JSON the docs at https://finage.co.uk/docs/api render); every path, parameter, and example comes from that source. All endpoints are read-only GET requests authenticated with an apikey query parameter. Responses must be requested with gzip Accept-Encoding (the API returns 406 "GZip compression required" otherwise).
  version: 1.0.0
  contact:
    name: Finage Support
    email: support@finage.co.uk
    url: https://finage.co.uk
  x-apievangelist:
    generated: '2026-07-22'
    method: generated
    source: https://api.finage.co.uk/op/v1/endpoints/list
servers:
- url: https://api.finage.co.uk
security:
- apiKey: []
tags:
- name: Canadian Stocks
paths:
  /last/stock/ca/{symbol}:
    get:
      operationId: canadaMarketLastPrice
      summary: Canada Market Last Price
      description: Finage has more than 2300+ Canada market data in real-time. You can get the last price for a symbol with this endpoint.
      tags:
      - Canadian Stocks
      parameters:
      - name: symbol
        in: path
        required: true
        description: Canada stock symbol that you want to get price
        schema:
          type: string
      responses:
        '200':
          description: Canada Market Last Price response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    description: Symbol of the Canada market
                  price:
                    type: number
                    description: Last price of the Canada market
                  timestamp:
                    type: integer
                    format: int64
                    description: Timestamp [ms]
              example:
                symbol: TBP
                price: 0.215
                timestamp: 1615225685191
        '401':
          $ref: '#/components/responses/Unauthorized'
  /agg/stock/global/ca/{symbol}/{time}/{from}/{to}:
    get:
      operationId: canadaMarketAggregates
      summary: Canada Market Aggregates
      description: With the Canada Market Aggregates API, you can get the tick bars of the Canada market.
      tags:
      - Canadian Stocks
      parameters:
      - name: symbol
        in: path
        required: true
        description: Symbol of the Canada Market
        schema:
          type: string
      - name: time
        in: path
        required: true
        description: Size of the time. [1min, 5min, 15min, 30min, 45min, 1h, 2h, 4h, 1day, 1week, 1month]
        schema:
          type: string
      - name: from
        in: path
        required: true
        description: Start date [yyyy-MM-dd]
        schema:
          type: string
      - name: to
        in: path
        required: true
        description: End date [yyyy-MM-dd]
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Limit of the results. Default is 100, maximum allowed limit is 5000. Please set a limit if you are using the API in the production.
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: You can sort the results by timestamp. asc will return ascending results oldest to newest, desc will return descending results newest to oldest. Default is asc.
        schema:
          type: string
      - name: date_format
        in: query
        required: false
        description: 'Choose date format: ''dt'' for datetime or ''ts'' for timestamp. [Default: timestamp]'
        schema:
          type: string
      - name: dbt_filter
        in: query
        required: false
        description: Daily-based time filter. You can allow the time filters to filter daily based. Otherwise, the filter will only trim the start and end of the output. Default is false.
        schema:
          type: string
      - name: st
        in: query
        required: false
        description: Start time in UTC. (Eg. 17:30)
        schema:
          type: string
      - name: et
        in: query
        required: false
        description: End time in UTC. (Eg. 17:45)
        schema:
          type: string
      responses:
        '200':
          description: Canada Market Aggregates response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                    description: Symbol of the Canada Market
                  totalResults:
                    type: integer
                    description: Total result size
                  o:
                    type: number
                    description: Open price
                  h:
                    type: number
                    description: Highest price
                  l:
                    type: number
                    description: Lowest price
                  c:
                    type: number
                    description: Close price
                  v:
                    type: integer
                    description: Volume
                  t:
                    type: integer
                    format: int64
                    description: Timestamp [ms]
              example:
                symbol: BB
                totalResults: 3
                results:
                - o: '15.15000'
                  h: '15.16000'
                  l: '13.05000'
                  c: '13.31000'
                  v: '12869600'
                  t: '2021-02-25'
                - o: '13.30000'
                  h: '13.65000'
                  l: '12.70000'
                  c: '12.87000'
                  v: '8049441'
                  t: '2021-02-26'
                - o: '13.14000'
                  h: '14.23000'
                  l: '13.08000'
                  c: '13.79000'
                  v: '6206248'
                  t: '2021-03-01'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Missing or invalid API key, or your plan does not include this market.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Please use your APIKey to make a request.
  schemas:
    Error:
      type: object
      description: Finage error envelope — a single error string.
      properties:
        error:
          type: string
          description: Human-readable error message.
  securitySchemes:
    apiKey:
      type: apiKey
      name: apikey
      in: query
      description: Finage API key, passed as the apikey query parameter on every request. Get one at https://moon.finage.co.uk/register.
externalDocs:
  description: Finage API documentation
  url: https://finage.co.uk/docs/api
